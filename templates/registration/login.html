
{% extends 'nonuser_base.html' %}
{% block extrastyle %}
{% endblock %}
{%block title%} OCSSC | LOGIN {%endblock%}
{%load crispy_forms_tags%}  
{%block content%} 
		<div class="login-box">

    <div class="login-logo">
        <b>OCSSCS</b>
    </div>

    <div class="card">
        <div class="card-body login-card-body">

            <p class="login-box-msg">
                Sign in to start your session
            </p>

            <form action="{% url 'cm_login' %}" method="POST">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit"
                        class="btn btn-primary btn-block mt-3">
                    Login
                </button>
            </form>

            <div class="mt-3">
                <a href="#">Forgot Password?</a>
            </div>

        </div>
    </div>

</div>
{%endblock%}
